[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-starter"
version = "0.1.0"
description = "A minimal, customizable browser voice-agent starter."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
voice-agent = "voice_agent.web:main"

[tool.setuptools.packages.find]
include = ["voice_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
